<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hire-ed.consulting — coming soon</title>
<meta name="description" content="hire-ed.consulting is building. Connect with Ed Flaherty on LinkedIn in the meantime.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --parchment: #F1E9D8;
    --pine: #26402F;
    --pine-soft: #4A5F4F;
    --rust: #B5542A;
    --rust-dark: #954327;
    --rule: #D8CBA8;
  }
  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ height: 100%; }
  body{
    margin: 0;
    background: var(--parchment);
    color: var(--pine);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .contours{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.35;
    z-index: 0;
  }
  .card{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
    max-width: 520px;
  }
  .wordmark{
    font-family: "Bitter", serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--pine);
    margin: 0 0 40px;
    letter-spacing: 0.01em;
  }
  .wordmark span{ color: var(--rust); }
  h1{
    font-family: "Bitter", serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.15;
    margin: 0 0 16px;
  }
  p.sub{
    font-family: "Bitter", serif;
    font-style: italic;
    font-weight: 400;
    color: var(--rust-dark);
    font-size: 17px;
    margin: 0 0 40px;
  }
  .btn{
    display: inline-block;
    font-family: "Public Sans", sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 3px;
    background: var(--pine);
    color: var(--parchment);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .btn:hover{ background: var(--rust-dark); }
  .btn:active{ transform: translateY(1px); }

  @media (prefers-reduced-motion: no-preference){
    .path{ animation: draw 2.4s ease-out forwards; }
  }
  @keyframes draw{
    from{ stroke-dashoffset: 900; }
    to{ stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

  <svg class="contours" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="path" style="stroke-dasharray:900;" d="M-50,150 Q300,60 600,160 T1250,140" stroke="#26402F" stroke-width="1.5" fill="none"/>
    <path class="path" style="stroke-dasharray:900;" d="M-50,260 Q300,150 600,270 T1250,250" stroke="#26402F" stroke-width="1.5" fill="none"/>
    <path class="path" style="stroke-dasharray:900;" d="M-50,380 Q300,250 600,390 T1250,370" stroke="#26402F" stroke-width="1.5" fill="none"/>
    <path class="path" style="stroke-dasharray:900;" d="M-50,500 Q300,360 600,510 T1250,490" stroke="#26402F" stroke-width="1.5" fill="none"/>
    <path class="path" style="stroke-dasharray:900;" d="M-50,620 Q300,470 600,630 T1250,610" stroke="#26402F" stroke-width="1.5" fill="none"/>
    <path class="path" style="stroke-dasharray:900;" d="M-50,720 Q300,590 600,730 T1250,710" stroke="#26402F" stroke-width="1.5" fill="none"/>
  </svg>

  <div class="card">
    <p class="wordmark">hire-ed<span>.</span>consulting</p>
    <h1>Something exciting is building.</h1>
    <p class="sub">Moving forward — one Slate instance at a time.</p>
    <a class="btn" href="https://www.linkedin.com/in/edward-flaherty" target="_blank" rel="noopener">Connect on LinkedIn</a>
  </div>

</body>
</html>
